name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'host_web/**'
      - 'previews/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ['构建固件并附加到 Release']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.repository == 'wickenzh/ESP32-S3-RLCD-4.2' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.event == 'release' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build site and mirror verified firmware
        run: node host_web/scripts/build_pages_site.mjs "$RUNNER_TEMP/site"
        env:
          GH_API_TOKEN: ${{ github.token }}
          SDL_PREVIEW_SOURCE: ${{ github.workspace }}/previews
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
