name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'host_web/**'
      - 'RLCD_CLOCK/**'
      - 'previews/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ['构建固件并附加到 Release']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.repository == 'wickenzh/ESP32-S3-RLCD-4.2' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.event == 'release' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build LVGL SDL WebAssembly simulator
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 4.0.23 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          test "$(git -C "$RUNNER_TEMP/emsdk" rev-parse HEAD)" = c0bb220cb6e6f4e0fabb6f6db9efd53390ef5e56
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.23
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.23
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          curl --fail --location --retry 3 https://github.com/lvgl/lvgl/archive/refs/tags/v8.4.0.tar.gz -o "$RUNNER_TEMP/lvgl.tar.gz"
          echo "3b454d602e1667b9bd2c434f5e8156753d92cf3e71fc40a0cb0d99fca9a605be  $RUNNER_TEMP/lvgl.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/lvgl"
          tar -xzf "$RUNNER_TEMP/lvgl.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/lvgl"
          python3 host_web/scripts/build_web_simulator.py --lvgl "$RUNNER_TEMP/lvgl" --output "$RUNNER_TEMP/simulator" --build "$RUNNER_TEMP/wasm-build"
      - name: Build site and mirror verified firmware
        run: node host_web/scripts/build_pages_site.mjs "$RUNNER_TEMP/site"
        env:
          GH_API_TOKEN: ${{ github.token }}
          SDL_PREVIEW_SOURCE: ${{ github.workspace }}/previews
          SIMULATOR_BUILD_DIR: ${{ runner.temp }}/simulator
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
