name: 构建固件并附加到 Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "需要构建的版本标签，例如 v1.5.10"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: clock-firmware-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: ESP32-S3 固件
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 确定构建版本
        id: version
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "版本格式无效：$REQUESTED_VERSION" >&2
            exit 1
          fi
          echo "version=$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"

      - name: 检出对应版本源码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || steps.version.outputs.version }}
          submodules: recursive

      - name: 校验源码版本
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          project_version="$(sed -n 's/.*PROJECT_VER "\(v[^"]*\)".*/\1/p' CMakeLists.txt | head -n 1)"
          if [[ "$project_version" != "$EXPECTED_VERSION" ]]; then
            echo "标签版本 $EXPECTED_VERSION 与工程版本 $project_version 不一致" >&2
            exit 1
          fi

      - name: 准备私有 OTA 端点
        env:
          OTA_MANIFEST_URL: ${{ secrets.WEATHER_CLOCK_OTA_MANIFEST_URL }}
          OTA_BACKUP_MANIFEST_URL: ${{ secrets.WEATHER_CLOCK_OTA_BACKUP_MANIFEST_URL }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/prepare_ota_endpoint.py \
            --output main/core/ota_endpoint_local.h
          test -s main/core/ota_endpoint_local.h
          echo "Private OTA endpoint configuration prepared"

      - name: 编译并生成双固件
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32s3
          path: .
          command: >-
            set -euo pipefail;
            idf.py build;
            cp build/weather_clock.bin "weather_clock_${{ steps.version.outputs.version }}.bin";
            cd build;
            esptool.py --chip esp32s3 merge_bin -o "../weather_clock_${{ steps.version.outputs.version }}_merged.bin" @flash_args

      - name: 校验构建产物
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "weather_clock_${VERSION}.bin"
          test -s "weather_clock_${VERSION}_merged.bin"
          sha256sum "weather_clock_${VERSION}.bin" "weather_clock_${VERSION}_merged.bin"

      - name: 等待同版本 Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          release_ready=0
          for _ in $(seq 1 30); do
            if gh release view "$VERSION" >/dev/null 2>&1; then
              release_ready=1
              break
            fi
            sleep 10
          done
          if [[ "$release_ready" != "1" ]]; then
            echo "等待同版本 Release 超时：$VERSION" >&2
            exit 1
          fi
          gh release view "$VERSION" --json body --jq .body > "$RUNNER_TEMP/release-notes.txt"

      - name: 生成 OTA 清单
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          OTA_PUBLIC_BASE="$(python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("firmware/latest.json").read_text(encoding="utf-8"))
          url = str(data.get("url", ""))
          marker = "/firmware/"
          if not url.startswith("https://") or marker not in url:
              raise SystemExit("existing latest.json does not contain a usable HTTPS OTA URL")
          print(url.split(marker, 1)[0])
          PY
          )"
          if [[ -z "$OTA_PUBLIC_BASE" ]]; then
            echo "无法从现有 latest.json 推导 OTA 公网基址" >&2
            exit 1
          fi
          python3 .github/scripts/update_manifests.py \
            --version "$VERSION" \
            --app "weather_clock_${VERSION}.bin" \
            --merged "weather_clock_${VERSION}_merged.bin" \
            --public-base "$OTA_PUBLIC_BASE" \
            --notes-file "$RUNNER_TEMP/release-notes.txt" \
            --latest firmware/latest.json \
            --versions firmware/versions.json

      - name: 保存 Actions 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: weather-clock-${{ steps.version.outputs.version }}
          path: |
            weather_clock_${{ steps.version.outputs.version }}.bin
            weather_clock_${{ steps.version.outputs.version }}_merged.bin
            firmware/latest.json
            firmware/versions.json
          if-no-files-found: error
          retention-days: 14

      - name: 附加到现有 Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          body_before="$(gh release view "$VERSION" --json body --jq .body)"
          gh release upload "$VERSION" \
            "weather_clock_${VERSION}.bin" \
            "weather_clock_${VERSION}_merged.bin" \
            --clobber
          body_after="$(gh release view "$VERSION" --json body --jq .body)"
          if [[ "$body_before" != "$body_after" ]]; then
            echo "上传附件后 Release 描述发生变化" >&2
            exit 1
          fi

      - name: 更新源码仓库 OTA 清单
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cp firmware/latest.json "$RUNNER_TEMP/latest.json"
          cp firmware/versions.json "$RUNNER_TEMP/versions.json"
          git fetch origin main
          git checkout -B ota-manifest-update origin/main
          mkdir -p firmware
          cp "$RUNNER_TEMP/latest.json" firmware/latest.json
          cp "$RUNNER_TEMP/versions.json" firmware/versions.json
          if git diff --quiet -- firmware/latest.json firmware/versions.json; then
            echo "OTA 清单无需更新"
          else
            git config user.name "GitHub Actions Firmware Builder"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add firmware/latest.json firmware/versions.json
            git commit -m "Update ${VERSION} OTA manifests [skip ci]"
            git push origin HEAD:main
          fi
